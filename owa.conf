ServerName localhost

<VirtualHost *:${PORT}>
	DocumentRoot /var/www/html
	# OWA's own .htaccess denies everything but its public entry points and assets.
	<Directory /var/www/html>
		Options FollowSymLinks
		AllowOverride All
		Require all granted
	</Directory>

	# Only REMOTE_ADDR (set from X-Real-IP) may name the visitor.
	RequestHeader unset X-Forwarded-For early
	RequestHeader unset Client-IP early
	RequestHeader unset X-Cluster-Client-IP early
	RequestHeader unset Forwarded-For early
	# Railway terminates TLS; links and cookies should still say https.
	SetEnvIf X-Forwarded-Proto https HTTPS=on

	# The database is installed from the command line at boot, so the web installer
	# never runs.
	<Location /install.php>
		Require all denied
	</Location>

	Alias /healthz /usr/local/share/owa/healthz
	<Directory /usr/local/share/owa>
		Require all granted
	</Directory>

	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog /dev/null combined
</VirtualHost>
